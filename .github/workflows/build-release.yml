name: Build & Deploy HoldGram APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare API_KEYS
        run: |
          cat << 'KEYS' > ./API_KEYS
          APP_ID = 6
          APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e"
          MAPS_V2_API = "${{ secrets.MAPS_KEY }}"
          SIGNING_KEY_PASSWORD = holdgram2026
          SIGNING_KEY_ALIAS = holdgram
          SIGNING_KEY_STORE_PASSWORD = holdgram2026
          STORE_FILE = config/holdgram.jks
          KEYS

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo apt-get clean
          df -h

      - name: Setup Build Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison gcc make curl ninja-build ccache

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache
          restore-keys: ccache

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;33.0.1 ndk;21.4.7075529 cmake;3.10.2.4988404"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build HoldGram APK
        run: |
          set -o pipefail
          ./gradlew assembleAfatRelease --no-daemon --no-configuration-cache --stacktrace 2>&1 | tee build.log

      - name: Show Failure Summary
        if: failure()
        run: |
          echo "==================== BUILD FAILED ===================="
          grep -C 10 -i "error:" build.log || true
          echo "==================== WHAT WENT WRONG ===================="
          grep -A 25 -i "What went wrong" build.log || true
          echo "==================== LAST 100 LINES ===================="
          tail -n 100 build.log

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Push Build Log to Git Branch
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add -f build.log
          git commit -m "chore: build log for run ${{ github.run_number }}" || true
          git push -f origin build-logs || true

      - name: Deploy Build Log to VPS
        if: always() && env.SSH_PRIVATE_KEY != ''
        continue-on-error: true
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST || 'sshpub.ru' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22022 }}
          source: "build.log"
          target: "/var/www/sshpub.ru/assets/"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          echo "Listing all generated APKs:"
          find TMessagesProj/build/outputs/apk -type f -name "*.apk" || true
          APK_PATH=$(find TMessagesProj/build/outputs/apk -type f -name "*.apk" ! -name "*-unaligned.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" dist/HoldGram.apk
            echo "Built APK: $APK_PATH -> dist/HoldGram.apk ($(ls -lh dist/HoldGram.apk | awk '{print $5}'))"
          else
            echo "ERROR: APK not found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoldGram-Release-APK
          path: dist/HoldGram.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HoldGram v1.0.${{ github.run_number }}"
          body: |
            ### 🚀 HoldGram Native Android Build
            - Native Telegram Core (Java / Kotlin / C++ NDK)
            - Ghost Mode (MTProto invisible)
            - Anti-Delete (Saved deleted messages & media)
            - Expiring photos & Screenshot protection bypass
          files: dist/HoldGram.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Deploy to VPS (sshpub.ru)
        if: env.SSH_PRIVATE_KEY != ''
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST || 'sshpub.ru' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22022 }}
          source: "dist/HoldGram.apk"
          target: "/var/www/sshpub.ru/assets/"
          strip_components: 1
